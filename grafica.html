<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para a gráfica · Encontro de Lideranças Comerciais</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E9E9E9">
<!-- só o modo claro, como o index (ele, 19/10: "mesmo que o celular esteja no modo escuro... proíba 100%") -->
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light only">
<meta name="darkreader-lock">
<link rel="icon" type="image/png" href="assets/icone-64.png">
<link rel="apple-touch-icon" href="assets/icone-180.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Encontro de Lideranças Comerciais · Para a gráfica">
<meta property="og:description" content="Impressos do kit: bloco A5, caneta, carta e chocolate">
<meta property="og:image" content="https://cauadorn.github.io/encontro-lideranca-comercial/assets/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://cauadorn.github.io/encontro-lideranca-comercial/grafica.html">
<meta name="twitter:card" content="summary_large_image">
<!-- Aba "Para a gráfica" (27/10, #6800). Ele: "abrir mais uma página naquele site... a parte de produto de impressão para
     gráfica... com os dois selos, A e B... para ele colocar só essas solicitações de mockups, para a gente não mandar
     separado". Mesma chave do selo do index (localStorage "seloEncontro" e ?selo=), as imagens -b.webp = Selo B.
     Fotos e peças: ferramentas/site_assets.py (kit = magnific/v13 + colar_kit.py; peças = pecas_kit.html → v13/kit).
     Camisa fica fora (ele: "sem inserir a camisa q ja ta pronta"). Texto = PROPOSTA nossa (avisar só na mensagem). -->
<style>
  @font-face { font-family: 'Ubuntu'; src: url('assets/Ubuntu-Light.woff') format('woff');   font-weight: 300; font-display: swap; }
  @font-face { font-family: 'Ubuntu'; src: url('assets/Ubuntu-Regular.woff') format('woff'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Ubuntu'; src: url('assets/Ubuntu-Medium.woff') format('woff');  font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Ubuntu'; src: url('assets/Ubuntu-Bold.woff') format('woff');    font-weight: 700; font-display: swap; }
  :root {
    color-scheme: only light;
    --vermelho: #EF3D48; --carmim: #C21A30; --vinho: #5E0912; --vinho2: #8C0C1D;
    --tinta: #5B5B5B; --corpo: #606060; --leve: #6D6D6D; --estudio: #E9E9E9;
    --pad: clamp(24px, 6vw, 90px);
    --conv: radial-gradient(120% 90% at 50% 40%, #B3132A 0%, #8C0C1D 50%, #5E0912 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; color-scheme: only light; background: #E9E9E9; }
  body { font-family: 'Ubuntu', system-ui, sans-serif; color: var(--tinta); background: var(--estudio); overflow-x: hidden; color-scheme: only light; }
  @media (prefers-color-scheme: dark) {
    html { background: #E9E9E9; color-scheme: only light; }
    body { background: #E9E9E9; color: #5B5B5B; color-scheme: only light; }
  }
  img { display: block; max-width: 100%; }
  section { position: relative; padding: 0 var(--pad); }
  .bloco { max-width: 1080px; margin: 0 auto; }
  p, h2 { text-wrap: pretty; }

  /* navegação: a mesma do index, já no claro (a página não tem abertura escura) */
  #nav { position: fixed; top: 0; left: 0; right: 0; z-index: 40; display: flex; align-items: center; gap: 16px; padding: 14px var(--pad);
         background: rgba(233, 233, 233, .88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 1px 0 rgba(91,91,91,.08); }
  #nav img { height: 44px; width: auto; }
  #nav .t { font-weight: 500; font-size: 14px; letter-spacing: .02em; color: var(--tinta); white-space: nowrap; }
  .abas { margin-left: auto; display: flex; gap: 2px; }
  .abas a { font: 500 14px/1 'Ubuntu', sans-serif; color: var(--leve); text-decoration: none; letter-spacing: .02em;
            white-space: nowrap; padding: 0 14px; min-height: 40px; display: flex; align-items: center; }
  .abas a[aria-current] { color: var(--tinta); box-shadow: inset 0 -2px 0 var(--carmim); }
  .chave { margin-left: 14px; display: flex; border: 1px solid rgba(91, 91, 91, .3); border-radius: 999px; padding: 3px; gap: 2px; }
  .chave button { font: 500 13px/1 'Ubuntu', sans-serif; color: var(--tinta); background: none; border: 0; border-radius: 999px;
                  padding: 9px 14px; min-height: 36px; cursor: pointer; white-space: nowrap; letter-spacing: .02em; }
  .chave button.on { background: var(--tinta); color: #fff; }
  .abas-barra { display: none; }

  .rotulo { font-weight: 500; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--carmim); }
  h2 { font-size: clamp(44px, 8vw, 104px); line-height: 1; letter-spacing: -.02em; margin-top: 18px; }
  h2 .l { font-weight: 300; } h2 .f { font-weight: 700; color: var(--vermelho); }
  .txt { font-size: clamp(18px, 2.1vw, 26px); line-height: 1.45; color: var(--corpo); max-width: 640px; margin-top: 22px; }

  /* 1. o kit em foto */
  #kit { padding-top: clamp(130px, 14vw, 190px); padding-bottom: clamp(56px, 6vw, 90px); }
  .fotos { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(18px, 3vw, 28px); margin-top: 48px; }
  .foto { border-radius: 24px; overflow: hidden; position: relative; background: #ccc; aspect-ratio: 4 / 5; }
  .foto img { width: 100%; height: 100%; object-fit: cover; }
  .foto figcaption { position: absolute; left: 16px; bottom: 16px; background: #fff; color: var(--tinta); border-radius: 999px;
                     padding: 10px 18px; font-weight: 500; font-size: 14px; box-shadow: 0 8px 20px rgba(0,0,0,.15); }

  /* 2. peça por peça: a arte plana, como papel sobre a mesa, com a medida */
  #pecas { padding-top: clamp(40px, 5vw, 80px); padding-bottom: clamp(90px, 10vw, 150px); }
  .pecas { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(36px, 5vw, 64px) clamp(24px, 4vw, 48px); margin-top: 52px; align-items: end; }
  .peca.larga { grid-column: 1 / 3; }
  .peca img { width: 100%; height: auto; border-radius: 4px; box-shadow: 0 1px 2px rgba(60, 20, 20, .10), 0 18px 40px rgba(60, 20, 20, .16); }
  .peca.larga img { max-width: 760px; margin: 0 auto; }
  .peca figcaption { margin-top: 20px; text-align: center; }
  .peca .nome { display: block; font-weight: 500; font-size: clamp(17px, 1.8vw, 20px); color: var(--tinta); }
  .peca .medida { display: block; margin-top: 6px; font-size: 15px; color: var(--leve); }

  #fim { min-height: min(60svh, 520px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; color: #fff;
         background: var(--conv); text-align: center; padding-top: 80px; padding-bottom: 70px; }
  .logos { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .logo-box { background: #fff; border-radius: 14px; height: 74px; width: 200px; display: flex; align-items: center; justify-content: center; }
  .logo-box img { height: 40px; width: auto; }
  #fim small { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.75); }

  @media (max-width: 1100px) { #nav .t { display: none; } }
  @media (max-width: 900px) {
    #nav .abas { display: none; } .chave { margin-left: auto; }
    .abas-barra { display: flex; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
                  z-index: 45; background: #fff; border-radius: 999px; padding: 4px; gap: 2px; box-shadow: 0 10px 30px rgba(40, 0, 8, .28); }
    .abas-barra a { font: 500 14px/1 'Ubuntu', sans-serif; color: var(--tinta); text-decoration: none; white-space: nowrap; letter-spacing: .02em;
                    padding: 0 18px; min-height: 44px; display: flex; align-items: center; border-radius: 999px; }
    .abas-barra a[aria-current] { background: var(--carmim); color: #fff; }
    #fim { padding-bottom: 120px; }
  }
  @media (max-width: 640px) {
    .chave button span { display: none; } .chave button { padding: 0 16px; min-height: 44px; }
    .fotos { grid-template-columns: 1fr; }
    .pecas { grid-template-columns: 1fr; } .peca.larga { grid-column: auto; }
    .peca:not(.larga) img { max-width: 82%; margin: 0 auto; }
    #fim small span { display: block; } #fim small .ponto { display: none; }
  }
</style>
</head>
<body>

<nav id="nav">
  <img src="assets/credfranco-logo-clean.svg" alt="CREDFRANCO">
  <span class="t">Encontro de Lideranças Comerciais</span>
  <div class="abas"><a href="./">Identidade</a><a href="grafica.html" aria-current="page">Para a gráfica</a></div>
  <div class="chave" role="group" aria-label="Versão do selo">
    <button type="button" data-selo="a" class="on">Selo A<span> · Ascensão</span></button>
    <button type="button" data-selo="b">Selo B<span> · Ao lado</span></button>
  </div>
</nav>
<nav class="abas-barra" aria-label="Páginas"><a href="./">Identidade</a><a href="grafica.html" aria-current="page">Para a gráfica</a></nav>

<main>
  <section id="kit">
    <div class="bloco">
      <div class="rotulo">Para a gráfica</div>
      <h2><span class="l">Impressos</span> <span class="f">do kit</span></h2>
      <p class="txt">Bloco A5, caneta, carta e chocolate. Cada peça vem nos dois selos: troque na chave lá em cima.</p>
      <div class="fotos">
        <figure class="foto"><img data-troca src="assets/aplic-kit.webp?v=28" alt="Kit do evento na mesa: bloco A5, caneta vermelha, carta no envelope e chocolate"><figcaption>O kit completo</figcaption></figure>
        <figure class="foto"><img data-troca src="assets/aplic-agenda.webp?v=27" alt="Bloco A5 com a capa vinho e a caneta" loading="lazy"><figcaption>Bloco A5 e caneta</figcaption></figure>
      </div>
    </div>
  </section>

  <section id="pecas">
    <div class="bloco">
      <div class="rotulo">Peça por peça</div>
      <h2><span class="l">Arte e</span> <span class="f">medida</span></h2>
      <div class="pecas">
        <figure class="peca"><img data-troca src="assets/grafica-capa.webp?v=28" alt="Capa do bloco: vinho, selo e logo em branco, estampa embaixo" loading="lazy" width="800" height="1131">
          <figcaption><span class="nome">Capa do bloco</span><span class="medida">A5 · 148 × 210 mm</span></figcaption></figure>
        <figure class="peca"><img data-troca src="assets/grafica-carta.webp?v=28" alt="Carta: papel branco com o selo, a frase e a logo" loading="lazy" width="800" height="1131">
          <figcaption><span class="nome">Carta</span><span class="medida">A5 · 148 × 210 mm</span></figcaption></figure>
        <figure class="peca larga"><img data-troca src="assets/grafica-chocolate.webp?v=28" alt="Cinta do chocolate: estampa na ponta e o selo no branco" loading="lazy" width="1240" height="600">
          <figcaption><span class="nome">Cinta do chocolate</span><span class="medida">Frente 155 × 75 mm · barra de 100 g</span></figcaption></figure>
      </div>
    </div>
  </section>

  <section id="fim">
    <div class="logos">
      <div class="logo-box"><img src="assets/credfranco-logo-clean.svg" alt="CREDFRANCO"></div>
      <div class="logo-box"><img src="assets/cf-promotora-logo.png" alt="CF Promotora"></div>
    </div>
    <small><span>Impressos para a gráfica</span><span class="ponto"> · </span><span>outubro de 2026</span></small>
  </section>
</main>

<script>
/* a mesma chave do selo do index: lembra a escolha (localStorage) e aceita ?selo=b; as imagens -b.webp = Selo B */
(function () {
  let modo = 'a';
  try { modo = (new URLSearchParams(location.search).get('selo') || localStorage.getItem('seloEncontro') || 'a').toLowerCase(); } catch (e) {}
  if (modo !== 'b') modo = 'a';
  const imgs = [...document.querySelectorAll('img[data-troca]')];
  imgs.forEach(im => { im.dataset.a = im.getAttribute('src'); });
  function aplicar() {
    document.querySelectorAll('.chave button').forEach(b => b.classList.toggle('on', b.dataset.selo === modo));
    imgs.forEach(im => { const s = modo === 'b' ? im.dataset.a.replace('.webp', '-b.webp') : im.dataset.a; if (im.getAttribute('src') !== s) im.setAttribute('src', s); });
    document.querySelectorAll('.abas a, .abas-barra a').forEach(a => a.setAttribute('href', a.getAttribute('href').split('?')[0] + '?selo=' + modo));
  }
  document.querySelectorAll('.chave button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.selo === modo) return;
    modo = b.dataset.selo; try { localStorage.setItem('seloEncontro', modo); } catch (e) {}
    aplicar();
  }));
  aplicar();
})();
</script>
</body>
</html>
